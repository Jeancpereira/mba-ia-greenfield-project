services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube1234
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    # NOTE (SI-05): we intentionally do NOT configure an
    # `AbortIncompleteMultipartUpload` bucket lifecycle rule here.
    # `mc ilm rule add` has no flag for it in the pinned `minio/mc` image
    # (checked: `mc ilm rule add --help` lists only expire/transition
    # actions), and both `mc ilm rule import` and a direct
    # `PutBucketLifecycleConfiguration` S3 call accept a rule containing
    # `AbortIncompleteMultipartUpload` without error but the MinIO server
    # silently drops the field — `GetBucketLifecycleConfiguration` never
    # shows it back. This looks like a real limitation of the MinIO version
    # pinned by the `minio/minio` image used here, not a syntax issue.
    # See docs/tasks/followup-orphaned-drafts-sweeper.md for the tracked
    # follow-up (a scheduled sweeper) that covers this gap instead.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamtube streamtube1234 &&
      mc mb --ignore-existing local/streamtube
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio-data:


